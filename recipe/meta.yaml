{% set name = "banal" %}
{% set version = "1.1.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # PyPI has no sdist from 1.1.0 onward: upstream publishes with
  # `python -m build --wheel`. Use the tagged GitHub archive, which also
  # carries LICENSE and the test suite.
  url: https://github.com/pudo/banal/archive/refs/tags/{{ version }}.tar.gz
  sha256: 4fa13afa462b7c601163fd5fa970c51ee24ebc8291c3fbc0598bdf2c2ed18a68

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - hatchling
    - python {{ python_min }}
  run:
    - python >={{ python_min }}

test:
  source_files:
    - tests
  imports:
    - banal
  commands:
    - pip check
    - pytest tests
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: http://github.com/pudo/banal
  summary: Commons of banal micro-functions for Python.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - vasudevanv
